<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doro</title>
    <meta name="theme-color" content="#8f6c74" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 14% 10%, rgba(255, 241, 245, 0.24), transparent 34%),
          radial-gradient(circle at 84% 18%, rgba(117, 74, 87, 0.2), transparent 30%),
          linear-gradient(180deg, #b8929b 0%, #8f6c74 100%);
        color: #f8fafc;
        font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #doro-boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: inherit;
        opacity: 1;
        visibility: visible;
        transition: opacity 360ms cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 360ms;
      }

      #doro-boot-shell {
        width: min(92vw, 540px);
        border-radius: 34px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.06)),
          linear-gradient(145deg, rgba(255, 255, 255, 0.16), rgba(15, 23, 42, 0.18));
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        box-shadow: 0 40px 80px -54px rgba(15, 23, 42, 0.72);
        padding: 28px 28px 24px;
      }

      #doro-boot-title {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.58);
      }

      #doro-boot-time {
        margin-top: 18px;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        font-size: clamp(54px, 9vw, 92px);
        font-weight: 700;
        letter-spacing: -0.06em;
        color: rgba(255, 255, 255, 0.94);
      }

      #doro-boot-copy {
        margin-top: 12px;
        max-width: 24rem;
        font-size: 13px;
        line-height: 1.65;
        color: rgba(255, 255, 255, 0.62);
      }

      #doro-boot-bar {
        margin-top: 22px;
        position: relative;
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
      }

      #doro-boot-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.18));
        animation: doroBootSweep 1.15s ease-in-out infinite;
        transform-origin: left center;
      }

      body.doro-app-ready #doro-boot-screen {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      @keyframes doroBootSweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(240%);
        }
      }
    </style>
</head>
  <body>
    <div id="doro-boot-screen" aria-hidden="true">
      <div id="doro-boot-shell">
        <div id="doro-boot-title">Doro Focus</div>
        <div id="doro-boot-time">25:00</div>
        <div id="doro-boot-copy">Loading your timer, tasks, and schedule before the glass UI fades in.</div>
        <div id="doro-boot-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
