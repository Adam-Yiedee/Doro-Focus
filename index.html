<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doro</title>
    <meta name="theme-color" content="#8f6c74" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #8f6c74;
        color: #f8fafc;
        font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #doro-boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: inherit;
        opacity: 1;
        visibility: visible;
        transition: opacity 360ms cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 360ms;
      }

      #doro-boot-shell {
        width: min(92vw, 540px);
        border-radius: 34px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.06)),
          linear-gradient(145deg, rgba(255, 255, 255, 0.16), rgba(15, 23, 42, 0.18));
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        box-shadow: 0 40px 80px -54px rgba(15, 23, 42, 0.72);
        padding: 28px 28px 24px;
        text-align: center;
      }

      #doro-boot-brandline {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      #doro-boot-kicker {
        font-family: "Outfit", "Manrope", ui-sans-serif, sans-serif;
        font-size: clamp(18px, 3vw, 24px);
        font-weight: 500;
        letter-spacing: -0.04em;
        color: rgba(255, 255, 255, 0.74);
      }

      #doro-boot-logo {
        font-family: "Outfit", "Manrope", ui-sans-serif, sans-serif;
        font-size: clamp(56px, 10vw, 90px);
        font-weight: 700;
        letter-spacing: -0.07em;
        line-height: 0.88;
        color: rgba(255, 255, 255, 0.94);
        text-transform: lowercase;
        user-select: none;
      }

      #doro-boot-copy {
        margin-top: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        max-width: none;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.56);
      }

      #doro-boot-dots {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      #doro-boot-dots span {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.78);
        animation: doroBootDotPulse 1.1s ease-in-out infinite;
      }

      #doro-boot-dots span:nth-child(2) {
        animation-delay: 0.14s;
      }

      #doro-boot-dots span:nth-child(3) {
        animation-delay: 0.28s;
      }

      #doro-boot-bar {
        margin-top: 22px;
        position: relative;
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
      }

      #doro-boot-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.18));
        animation: doroBootSweep 1.15s ease-in-out infinite;
        transform-origin: left center;
      }

      body.doro-app-ready #doro-boot-screen {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      @keyframes doroBootSweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(240%);
        }
      }

      @keyframes doroBootDotPulse {
        0%,
        80%,
        100% {
          transform: translateY(0) scale(0.7);
          opacity: 0.28;
        }
        40% {
          transform: translateY(-3px) scale(1);
          opacity: 1;
        }
      }
    </style>
</head>
  <body>
    <div id="doro-boot-screen" aria-hidden="true">
      <div id="doro-boot-shell">
        <div id="doro-boot-brandline">
          <div id="doro-boot-kicker">Pomo with</div>
          <div id="doro-boot-logo">doro</div>
        </div>
        <div id="doro-boot-copy">
          <span>Loading Workspace</span>
          <span id="doro-boot-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </div>
        <div id="doro-boot-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
